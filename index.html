<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>AI Chat Assistant</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">✦</span>
        <h1>AI Assistant</h1>
      </div>
      <button id="newChat" class="ghost" type="button">New chat</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div id="empty" class="empty">
        <div class="logo big" aria-hidden="true">✦</div>
        <h2>How can I help you today?</h2>
        <div class="suggestions">
          <button type="button" class="chip">Explain how APIs work in simple words</button>
          <button type="button" class="chip">Write a short email asking for a leave</button>
          <button type="button" class="chip">Give me a 3-day study plan for SQL</button>
        </div>
      </div>
    </main>

    <div id="status" class="status" hidden></div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message the assistant…" aria-label="Message" enterkeyhint="send"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12 2-12 2z"/></svg>
      </button>
    </form>
    <p class="fineprint">AI can make mistakes. Check important information.</p>
  </div>
  <script src="/app.js"></script>
</body>
</html>
